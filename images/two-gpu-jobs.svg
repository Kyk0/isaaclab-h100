<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
  <title id="t">Two GPU jobs in Isaac Sim</title>
  <desc id="d">Physics goes through CUDA and works on an H100. Rendering needs Vulkan and RT cores, so it needs an RTX GPU and fails on an H100. End to end on the H100: train headless, record every link's pose, watch it in a browser. No RT cores needed at any step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 22px; font-weight: 700; }
    .m { font-size: 17px; }
    .s { font-size: 15px; fill: #57606a; }
    .ok { font-size: 17px; font-weight: 600; fill: #1a7f37; }
    .no { font-size: 17px; font-weight: 600; fill: #cf222e; }
    .flow { font-size: 16px; font-weight: 600; }
    .line { stroke: #57606a; stroke-width: 2; fill: none; }
  </style>

  <!-- card background: white so it reads on light and dark GitHub themes -->
  <rect x="1" y="1" width="718" height="378" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- left: physics -->
  <rect x="28" y="26" width="318" height="196" rx="14" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/>
  <text x="187" y="64" text-anchor="middle" class="h">Physics</text>
  <text x="187" y="90" text-anchor="middle" class="s">PhysX, all envs in parallel</text>
  <path class="line" d="M187 102 V128" marker-end="url(#arrow)"/>
  <text x="187" y="152" text-anchor="middle" class="m">CUDA</text>
  <circle cx="110" cy="190" r="13" fill="#1a7f37"/>
  <path d="M103 190 l5 5 l9 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="196" class="ok">works on H100</text>

  <!-- right: rendering -->
  <rect x="374" y="26" width="318" height="196" rx="14" fill="#ffebe9" stroke="#ff8182" stroke-width="2"/>
  <text x="533" y="64" text-anchor="middle" class="h">Rendering</text>
  <text x="533" y="90" text-anchor="middle" class="s">videos, cameras, viewport</text>
  <path class="line" d="M533 102 V128" marker-end="url(#arrow)"/>
  <text x="533" y="152" text-anchor="middle" class="m">Vulkan + RT cores</text>
  <circle cx="420" cy="190" r="13" fill="#cf222e"/>
  <path d="M414 184 l12 12 M426 184 l-12 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="442" y="196" class="no">on H100: needs an RTX GPU</text>

  <!-- bottom: the end-to-end pipeline -->
  <rect x="28" y="262" width="186" height="64" rx="12" fill="#e6f7fb" stroke="#38c6e8" stroke-width="2"/>
  <text x="121" y="300" text-anchor="middle" class="flow">train on H100</text>
  <path class="line" d="M218 294 H260" marker-end="url(#arrow)"/>
  <rect x="267" y="262" width="186" height="64" rx="12" fill="#e6f7fb" stroke="#38c6e8" stroke-width="2"/>
  <text x="360" y="300" text-anchor="middle" class="flow">record on H100</text>
  <path class="line" d="M457 294 H499" marker-end="url(#arrow)"/>
  <rect x="506" y="262" width="186" height="64" rx="12" fill="#e6f7fb" stroke="#38c6e8" stroke-width="2"/>
  <text x="599" y="300" text-anchor="middle" class="flow">watch in a browser</text>
  <text x="360" y="356" text-anchor="middle" class="s">End to end on the H100: no step needs RT cores.</text>
</svg>
