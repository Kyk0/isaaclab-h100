# Publishes site/ (plus images/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master, main]
    paths: ["site/**", "images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          set -euo pipefail
          shopt -s nullglob                     # a pattern with no match expands to nothing
          mkdir -p _site/images
          cp -r site/. _site/
          imgs=(images/*.png images/*.jpg images/*.svg images/*.gif)   # no videos: the mp4 is a release asset
          if (( ${#imgs[@]} )); then cp "${imgs[@]}" _site/images/; fi
          # absolute URLs (og:image, canonical, sitemap) and the sitemap date;
          # Pages may report the custom-domain base URL as http://, the site is served over https
          SITE_URL="${{ steps.pages.outputs.base_url }}"
          SITE_URL="${SITE_URL/#http:\/\//https://}"
          for f in _site/index.html _site/robots.txt _site/sitemap.xml; do
            sed -i -e "s#__SITE_URL__#${SITE_URL}#g" -e "s#__LASTMOD__#$(date -u +%Y-%m-%d)#g" "$f"
          done
          ls -la _site _site/images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
